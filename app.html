<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>网兜 Web 版</title>
    <link rel="icon" href="assets/app-icon.png" type="image/png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><img src="assets/app-icon.png" alt="网兜" width="26" height="26" /><span>网兜 Web</span></a>
      <span id="user-chip" class="user-chip" hidden></span>
      <div class="topbar-actions">
        <button id="tab-files" class="btn btn-sm topbar-btn is-active">文件管理</button>
        <button id="tab-media" class="btn btn-sm topbar-btn">音乐视频</button>
        <button id="btn-logout" class="btn btn-sm topbar-btn" hidden>退出登录</button>
      </div>
    </header>

    <!-- 登录视图 -->
    <main id="view-login" class="login-view">
      <div class="login-card">
        <h1 id="login-title">登录网兜 Web</h1>
        <p class="hint" id="login-hint">使用网兜账号（邮箱 + 密码）登录。登录后将在本机解密云端备份的网盘账号，凭证不经服务器存储。</p>
        <label>邮箱<input id="login-email" type="email" placeholder="you@example.com" autocomplete="username" /></label>
        <label>密码<input id="login-password" type="password" placeholder="登录密码" autocomplete="current-password" /></label>
        <div id="register-fields" hidden>
          <label>邮箱验证码<span class="code-row">
            <input id="register-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" />
            <button id="btn-send-code" type="button" class="btn btn-sm">获取验证码</button>
          </span></label>
          <div id="turnstile-row" class="turnstile-row"></div>
        </div>
        <div id="captcha-row" class="captcha-row">
          <label>图形验证码<input id="login-captcha" type="text" inputmode="numeric" maxlength="4" placeholder="输入图中数字" autocomplete="off" /></label>
          <div id="captcha-img" class="captcha-img" title="点击刷新"></div>
        </div>
        <p id="login-msg" class="msg"></p>
        <button id="btn-login" class="btn btn-primary btn-block">登录</button>
        <button id="switch-mode" type="button" class="btn btn-ghost btn-block linklike">没有账号？注册</button>
        <p class="hint tight">
          还没有云端数据？先在
          <a href="/" target="_blank" rel="noopener">网兜客户端</a>
          注册登录并开启「云端备份网盘账号」。
        </p>
      </div>
    </main>

    <!-- 主视图 -->
    <main id="view-app" class="app-view" hidden>
      <aside class="side">
        <div class="side-head">
          存储账号
          <button id="btn-add-account" type="button" class="side-add" title="添加网盘账号">＋ 添加</button>
        </div>
        <ul id="account-list" class="account-list"></ul>
        <p class="hint tight" id="account-hint"></p>
      </aside>

      <section class="main">
        <!-- 文件管理 -->
        <div id="page-files" class="page">
          <div class="toolbar">
            <div id="crumbs" class="crumbs"></div>
            <div class="toolbar-actions">
              <button id="btn-refresh" class="btn btn-sm">刷新</button>
              <button id="btn-mkdir" class="btn btn-sm">新建文件夹</button>
            </div>
          </div>
          <p id="app-msg" class="msg"></p>
          <div class="table-wrap">
            <table class="file-table">
              <thead>
                <tr><th class="col-check"></th><th>名称</th><th class="col-size">大小</th><th class="col-time">修改时间</th><th class="col-ops">操作</th></tr>
              </thead>
              <tbody id="file-tbody">
                <tr><td colspan="5" class="empty-cell">选择左侧账号浏览文件</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 音乐视频 -->
        <div id="page-media" class="page" hidden>
          <div class="media-head">
            <h2>音乐视频</h2>
            <div class="media-actions">
              <button id="btn-scan-music" class="btn btn-sm btn-primary">扫描音乐</button>
              <button id="btn-scan-video" class="btn btn-sm">扫描视频</button>
              <button id="btn-scan-stop" class="btn btn-sm" hidden>停止扫描</button>
            </div>
          </div>
          <p class="hint tight">扫描当前选中账号的网盘目录（最多 150 个文件夹），找到的音频/视频可在线播放或下载。</p>
          <p id="media-msg" class="msg"></p>
          <div class="media-tabs">
            <button id="media-tab-music" class="btn btn-sm is-active">音乐</button>
            <button id="media-tab-video" class="btn btn-sm">视频</button>
          </div>
          <div class="table-wrap">
            <table class="file-table">
              <thead>
                <tr><th>名称</th><th class="col-size">大小</th><th>路径</th><th class="col-ops">操作</th></tr>
              </thead>
              <tbody id="media-tbody">
                <tr><td colspan="4" class="empty-cell">还没有扫描结果，点击上方「扫描音乐」开始</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <!-- 迷你播放器 -->
    <div id="player" class="player" hidden>
      <div class="player-disc" id="player-disc"></div>
      <div class="player-main">
        <div class="player-title" id="player-title">未在播放</div>
        <div class="player-controls">
          <button id="pl-prev" class="pl-btn" title="上一首">⏮</button>
          <button id="pl-play" class="pl-btn" title="播放/暂停">▶</button>
          <button id="pl-next" class="pl-btn" title="下一首">⏭</button>
          <span class="pl-time" id="pl-time">00:00 / 00:00</span>
          <input id="pl-seek" class="pl-seek" type="range" min="0" max="1000" value="0" />
          <button id="pl-list" class="pl-btn" title="播放列表">☰</button>
        </div>
      </div>
      <div id="pl-playlist" class="pl-playlist" hidden></div>
    </div>
    <audio id="pl-audio" preload="none"></audio>

    <div id="modal-root"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
